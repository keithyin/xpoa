[package]
name = "xpoa-cli"
version = "0.1.0"
edition = "2024"
description = "POA consensus per group from a grouped FASTA"
license = "MIT"
repository = "https://github.com/keithyin/xpoa"

[features]
# 透传 xpoa 的 cpp feature:关闭后为纯 Rust 构建(无需 cmake/Boost/SeqAn)
default = ["cpp"]
cpp = ["xpoa/cpp"]

[dependencies]
xpoa = { path = "../xpoa", version = "0.5.0", default-features = false }
clap = { version = "4", features = ["derive"] }
rayon = "1"
indicatif = "0.18"
