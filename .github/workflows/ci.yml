name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt & clippy
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --check
      # clippy --workspace --all-targets 覆盖 lib/bin/bench/examples/tests
      - name: clippy (zero warnings enforced)
        run: |
          set -o pipefail
          cargo clippy --release --workspace --all-targets -- -D warnings 2>&1 | tee clippy.log || {
            grep -inE "error" clippy.log | head -8 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: clippy-log
          path: clippy.log

  # 全量测试 + golden 复现校验:重新生成 golden 快照并与 git 基线比对,
  # 保证输出跨环境可复现(基线源自 v0.5.0 C++ 后端并经差分验证)
  test:
    name: tests + golden reproducibility
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build & test
        run: |
          set -o pipefail
          cargo test --release 2>&1 | tee test.log || {
            grep -E "^error|panicked" test.log | head -8 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: test.log
      - name: Regenerate golden snapshots & verify reproducibility
        run: |
          cargo run --release -p xpoa --example golden_gen
          git diff --exit-code xpoa/tests/golden
